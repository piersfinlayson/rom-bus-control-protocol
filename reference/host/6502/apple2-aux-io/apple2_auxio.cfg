# apple2_auxio.cfg — ca65/ld65 linker configuration, Apple IIe EF socket
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# Memory:
#   RAM   $0800-$7FFF.  Everything the tester runs and every byte it writes.
#         Text page 1 at $0400-$07FF is below it, and a IIe has 64K, so there
#         is no reason to be careful about the space above.
#   ROM   $E000-$FFFF.  The image the device serves.
#
# Segments:
#   BOOT      Reset entry, the copy into RAM, and the interrupt stub:
#             load=ROM, run=ROM.  They have to run from ROM, there being
#             nothing in RAM at reset.  All three vectors point into it.
#
#   CODE      Everything else, and RODATA behind it: load=ROM, run=RAM.  Both
#             are copied down before the first knock, because the command page
#             is a page of this image, and a host fetching instructions out of
#             it would be sending command bytes.  They are declared next to
#             each other so that one copy moves both.
#
#   BCH       The back-channel region, 512 bytes at $FC00.  The reset screen
#             reads the flash slot list, whose records are 32 bytes each, so
#             the 64 bytes the terminal manages with are not enough here.
#
#   CMD       The command page, 256 bytes at $FE00.  Declaring it rather than
#             leaving it to the fill makes an image whose code has grown into
#             the page a link error rather than a machine that sends its own
#             instructions to the device.
#
#   VECTORS   6 bytes at $FFFA-$FFFF, read at reset and never again.

MEMORY {
    RAM:   start = $0800, size = $7800, type = rw;
    ROM:   start = $E000, size = $2000, type = ro,
           fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    RODATA:  load = ROM, run  = RAM, type = ro, define = yes;
    BCH:     load = ROM, type = ro,  start = $FC00;
    CMD:     load = ROM, type = ro,  start = $FE00;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
