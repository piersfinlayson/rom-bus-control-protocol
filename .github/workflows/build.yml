name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'spec/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-c64-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      - name: Build c64-boot with pause before reset
        working-directory: reference/host/6502/c64-boot
        run: PAUSE_BEFORE_RESET=1 make

      - name: Build c64-boot
        working-directory: reference/host/6502/c64-boot
        run: make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: c64-boot
          path: reference/host/6502/c64-boot/build/c64_boot.bin

  build-vic20-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      - name: Build vic20-boot with pause before reset
        working-directory: reference/host/6502/vic20-boot
        run: PAUSE_BEFORE_RESET=1 make

      - name: Build vic20-boot
        working-directory: reference/host/6502/vic20-boot
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vic20-boot
          path: |
            reference/host/6502/vic20-boot/build/vic20_boot_pal.bin
            reference/host/6502/vic20-boot/build/vic20_boot_ntsc.bin

  build-apple2-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      - name: Build apple2-boot
        working-directory: reference/host/6502/apple2-boot
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple2-boot
          path: |
            reference/host/6502/apple2-boot/build/apple2_boot_f8.bin
            reference/host/6502/apple2-boot/build/apple2_boot_ef.bin

  build-c64-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65 and VICE
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 vice

      # The default target builds the .prg and the .d64 that carries it, so
      # c1541 from VICE has to be here.
      #
      # Every demo board too, because each one assembles different code and
      # only a build catches a board whose tables no longer match the program.
      # Each demo board starts by clearing the build directory, so they go
      # first and the real build last.
      - name: Build c64-led-test
        working-directory: reference/host/6502/c64-led-test
        run: |
          for board in 0 1 2 3; do
            make clean
            make BOARD=$board build/rbcp_led_demo.prg
          done
          make clean
          make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c64-led-test
          path: |
            reference/host/6502/c64-led-test/build/rbcp_led_test.prg
            reference/host/6502/c64-led-test/build/rbcp-led-test.d64

  build-pipe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      # One program, three machines.  Every image has to be built, because the
      # shared code is assembled against a different screen, a different clock
      # and a different ROM address each time.
      - name: Build c64-pipe-test
        working-directory: reference/host/6502/c64-pipe-test
        run: make

      - name: Build vic20-pipe-test
        working-directory: reference/host/6502/vic20-pipe-test
        run: make

      - name: Build apple2-pipe-test
        working-directory: reference/host/6502/apple2-pipe-test
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipe-test
          path: |
            reference/host/6502/c64-pipe-test/build/c64_pipe_kernal.bin
            reference/host/6502/c64-pipe-test/build/c64_pipe_basic.bin
            reference/host/6502/c64-pipe-test/build/c64_pipe_combined.bin
            reference/host/6502/vic20-pipe-test/build/vic20_pipe_pal.bin
            reference/host/6502/vic20-pipe-test/build/vic20_pipe_ntsc.bin
            reference/host/6502/apple2-pipe-test/build/apple2_pipe_pal.bin
            reference/host/6502/apple2-pipe-test/build/apple2_pipe_ntsc.bin

  build-rbcp-meter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      # One program, three machines.  Each build has to be run, because the
      # shared code is assembled against a different screen and a different
      # ROM address every time.
      - name: Build c64-rbcp-stress
        working-directory: reference/host/6502/c64-rbcp-stress
        run: make

      - name: Build vic20-rbcp-stress
        working-directory: reference/host/6502/vic20-rbcp-stress
        run: make

      - name: Build apple2-rbcp-stress
        working-directory: reference/host/6502/apple2-rbcp-stress
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbcp-meter
          path: |
            reference/host/6502/c64-rbcp-stress/build/c64_meter_kernal.bin
            reference/host/6502/c64-rbcp-stress/build/c64_meter_basic.bin
            reference/host/6502/c64-rbcp-stress/build/c64_meter_combined.bin
            reference/host/6502/vic20-rbcp-stress/build/vic20_meter_pal.bin
            reference/host/6502/vic20-rbcp-stress/build/vic20_meter_ntsc.bin
            reference/host/6502/apple2-rbcp-stress/build/apple2_meter.bin

  build-rbcp-aux-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      # One program, three machines.  Each build has to be run, because the
      # shared code is assembled against a different screen and a different
      # ROM address every time.
      #
      # Every demo board too, because each one assembles different tables and
      # only a build catches a board whose tables no longer match the program.
      - name: Build c64-aux-io
        working-directory: reference/host/6502/c64-aux-io
        run: |
          make
          for board in 0 1 2; do
            make BOARD=$board demo
          done

      - name: Build vic20-aux-io
        working-directory: reference/host/6502/vic20-aux-io
        run: |
          make
          for board in 0 1 2; do
            make BOARD=$board demo
          done

      - name: Build apple2-aux-io
        working-directory: reference/host/6502/apple2-aux-io
        run: |
          make
          for board in 0 1 2; do
            make BOARD=$board demo
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbcp-aux-io
          path: |
            reference/host/6502/c64-aux-io/build/c64_auxio_kernal.bin
            reference/host/6502/c64-aux-io/build/c64_auxio_basic.bin
            reference/host/6502/c64-aux-io/build/c64_auxio_combined.bin
            reference/host/6502/vic20-aux-io/build/vic20_auxio_pal.bin
            reference/host/6502/vic20-aux-io/build/vic20_auxio_ntsc.bin
            reference/host/6502/apple2-aux-io/build/apple2_auxio.bin

  build-rbcp-term:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      # One program, three machines.  Each build has to be run, because the
      # shared code is assembled against a different screen and a different
      # ROM address every time.
      - name: Build c64-rbcp-term
        working-directory: reference/host/6502/c64-rbcp-term
        run: make && make selftest

      - name: Build vic20-rbcp-term
        working-directory: reference/host/6502/vic20-rbcp-term
        run: make && make selftest

      - name: Build apple2-rbcp-term
        working-directory: reference/host/6502/apple2-rbcp-term
        run: make && make selftest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbcp-term
          path: |
            reference/host/6502/c64-rbcp-term/build/c64_term_kernal.bin
            reference/host/6502/c64-rbcp-term/build/c64_term_basic.bin
            reference/host/6502/c64-rbcp-term/build/c64_term_combined.bin
            reference/host/6502/vic20-rbcp-term/build/vic20_term_pal.bin
            reference/host/6502/vic20-rbcp-term/build/vic20_term_ntsc.bin
            reference/host/6502/apple2-rbcp-term/build/apple2_term.bin

  # Every Amiga application builds the same way and is tested the same way, so
  # both are a matrix over the applications rather than a job each.  A leg's
  # markers are the lines that say the run did what it was meant to, and its
  # frame count and fault rate are what that application's test needs.
  amiga-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: amiga-boot
            image: amiga_boot
          - app: amiga-rbcp-stress
            image: amiga_meter
          - app: amiga-pipe-test
            image: amiga_pipe
          - app: amiga-rbcp-term
            image: amiga_term
          - app: amiga-aux-io
            image: amiga_auxio
          - app: amiga-led-test
            image: amiga_led_test
    steps:
      - uses: actions/checkout@v4

      # vasm is not packaged, and upstream ships a tarball rather than a repo.
      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.app }}
        working-directory: reference/host/68k/${{ matrix.app }}
        run: make images

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: |
            reference/host/68k/${{ matrix.app }}/build/${{ matrix.image }}_256k.bin
            reference/host/68k/${{ matrix.app }}/build/${{ matrix.image }}_512k.bin

  amiga-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rom_kb: [256, 512]
        app:
          - amiga-boot
          - amiga-rbcp-stress
          - amiga-pipe-test
          - amiga-rbcp-term
          - amiga-aux-io
          - amiga-led-test
        # Every leg names its frame count and fault rate even where that is the
        # figure the test script would have chosen, because an unset matrix key
        # reaches the step as an empty string and the scripts read an empty
        # string as a number.
        include:
          - app: amiga-boot
            frames: 600
            fail_every: 0
            markers: SWITCH_AND_EXIT
          - app: amiga-rbcp-stress
            frames: 400
            fail_every: 1000
            markers: PH 0000 DISPLAY ON
          - app: amiga-pipe-test
            frames: 400
            fail_every: 0
            markers: |
              bits per second over
              gaps 0 missing 0 repeats 0 stripe 0 malformed 0
          - app: amiga-rbcp-term
            frames: 500
            fail_every: 0
            markers: '|<you said hello'
          - app: amiga-aux-io
            frames: 300
            fail_every: 0
            keys: "200:H"
            markers: SET 0/2 HIGH TAKEN
          - app: amiga-led-test
            frames: 900
            fail_every: 0
            markers: GOT 0 MODE 01 COL 56AC4D BRI 25 PER 0 AGREES
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Install MAME
        run: |
          sudo apt-get update
          sudo apt-get install -y mame

      - name: Fetch the keyboard ROM
        run: |
          mkdir -p "$RUNNER_TEMP/amiga-roms"
          curl -sSLo "$RUNNER_TEMP/amiga-roms/6570-036" \
            https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Commodore/Amiga/6570-036.rom
          echo "83b21d0c8b93fc9b9b3b287fde4ec8f3badac5a2  $RUNNER_TEMP/amiga-roms/6570-036" \
            | sha1sum -c -

      - name: Build ${{ matrix.app }} ${{ matrix.rom_kb }}KB
        working-directory: reference/host/68k/${{ matrix.app }}
        run: make ROM_KB=${{ matrix.rom_kb }}

      # MAME exits 0 whether the application ran or stopped on its error
      # screen, so the log is the only thing that says which happened.
      #
      # Every Amiga harness fills chip RAM with junk before the application's
      # variables are set up, so a variable read before it is written reads
      # junk here as it does on the machine.  Each run is checked for the line
      # that says the fill happened, because a fill that stopped happening
      # would put every leg back on the zeroed RAM MAME hands over.
      - name: Run ${{ matrix.app }} ${{ matrix.rom_kb }}KB under MAME
        working-directory: reference/host/68k/${{ matrix.app }}
        env:
          RBCP_TARGET: ${{ matrix.rom_kb }}
          RBCP_FRAMES: ${{ matrix.frames }}
          RBCP_FAIL_EVERY: ${{ matrix.fail_every }}
          RBCP_KEYS: ${{ matrix.keys }}
          MARKERS: ${{ matrix.markers }}
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "dirtied with" "$RUNNER_TEMP/run.log"
          printf '%s\n' "$MARKERS" > "$RUNNER_TEMP/markers"
          while IFS= read -r marker; do
              [ -n "$marker" ] || continue
              grep -qF -- "$marker" "$RUNNER_TEMP/run.log" \
                  || { echo "not in the log: $marker" >&2; exit 1; }
          done < "$RUNNER_TEMP/markers"

      # A run starts and a rate comes out whether or not the path keys work, so
      # this presses 2 and requires the run the tester started to be the one
      # that key asks for.  Before the keyboard handled punctuation, a shift
      # flag left set in dirty chip RAM turned the digit into a character the
      # menu had nothing for.
      - name: Run ${{ matrix.app }} ${{ matrix.rom_kb }}KB on the path key 2
        if: matrix.app == 'amiga-pipe-test' && matrix.rom_kb == 256
        working-directory: reference/host/68k/${{ matrix.app }}
        env:
          RBCP_TARGET: ${{ matrix.rom_kb }}
          RBCP_FRAMES: 400
          RBCP_KEYS: "200:2;260:Enter"
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/key.log"
          grep -q "dirtied with" "$RUNNER_TEMP/key.log"
          grep -q "paths LIB1" "$RUNNER_TEMP/key.log"

  # Every Apple II harness runs the same way, so they run as a matrix over the
  # applications rather than a job each.  The bootloader is two legs, because
  # its two builds go in different sockets of different machines.  A leg's
  # markers are the lines that say the run did what it was meant to, and its
  # frame count and keys are what that application's test needs.
  apple2-test:
    name: apple2-test (${{ matrix.app }}${{ matrix.target && format(', {0}', matrix.target) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every leg names its frame count, its keys and what the far end of the
        # pipe says, even where that is the value the fake device would have
        # chosen, because an unset matrix key reaches the step as an empty
        # string and the device reads an empty string as a number.  RBCP_TARGET
        # picks the bootloader's socket and no other harness reads it.
        include:
          - app: apple2-boot
            target: f8
            make_target: all
            frames: 600
            keys: ''
            send: ''
            markers: |
              ENTER_CMD_RESP page=$06 bch=$07B0 size=64
              SWITCH_AND_EXIT ram slot 1
              APPLE ][                 |
          - app: apple2-boot
            target: ef
            make_target: all
            frames: 600
            keys: ''
            send: ''
            markers: |
              ENTER_CMD_RESP page=$1E bch=$1FB0 size=64
              SWITCH_AND_EXIT ram slot 1
              Apple ][                 |
          - app: apple2-aux-io
            target: ''
            make_target: all
            frames: 600
            keys: H
            send: ''
            markers: |
              ENTER_CMD_RESP page=$1E bch=$1C00 size=512
              SET_AUX 0/2 high hold 0
              #######  +-----+  +-----+  +-----+
          - app: apple2-pipe-test
            target: ''
            make_target: all
            frames: 900
            keys: T
            send: ''
            markers: |
              | STOPPED
              SECONDS                    10
              REFUSALS                    0
              ERRORS                      0
          - app: apple2-rbcp-stress
            target: ''
            make_target: all
            frames: 600
            keys: ''
            send: ''
            markers: |
              1 IN -----
              ERR          0
              LOST          0
          - app: apple2-rbcp-term
            target: ''
            make_target: selftest
            frames: 600
            keys: ''
            send: 'you said hello\n'
            markers: |
              [pipe] LINE
              |<YOU SAID HELLO
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65 and MAME
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 mame

      # Both archives unpack into one directory because no name is in both.
      # apple2e.zip is not byte stable, so what is checked is the files it
      # holds rather than the archive.
      - name: Fetch the machine ROMs
        run: |
          roms="$RUNNER_TEMP/apple2-roms"
          base=https://raw.githubusercontent.com/Abdess/retrobios/13c561888d4d0cc2f8e00e53fe91405cc09ab7f1/bios/Apple/Apple%20II
          mkdir -p "$roms"
          for z in apple2p apple2e; do
              curl -sSLo "$RUNNER_TEMP/$z.zip" "$base/$z.zip"
              unzip -qoj "$RUNNER_TEMP/$z.zip" -d "$roms"
          done
          cd "$roms"
          sha1sum -c - <<'EOF'
          0287ebcef2c1ce11dc71be15a99d2d7e0e128b1e  341-0011.d0
          a75ce5aab6401355bf1ab01b04e4946a424879b5  341-0012.d8
          8d82a1da63224859bd619005fab62c4714b25dd7  341-0013.e0
          37501be96d36d041667c15d63e0c1eff2f7dd4e9  341-0014.e8
          e6bf91ed28464f42b807f798fc6422e5948bf581  341-0015.f0
          a28852ff997b4790e53d8d0352112c4b1a395098  341-0020-00.f8
          f9d312f128c9557d9d6ac03bfad6c3ddf83e5659  341-0036.chr
          12a2e718f5f4acd69b6c33a45a4a940b1440a481  342-0132-c.e12
          7060de104046736529c1e8a687a0dd7b84f8c51b  342-0133-a.chr
          8895a4b703f2184b673078f411f4089889b61c54  342-0134-a.64
          523838c19c79f481fa02df56856da1ec3816d16e  342-0135-b.64
          EOF

      - name: Build ${{ matrix.app }}
        working-directory: reference/host/6502/${{ matrix.app }}
        run: make ${{ matrix.make_target }}

      # MAME exits 0 whether the application ran or stopped on an error screen,
      # so the log is the only thing that says which happened.  The fake device
      # prints the text screen when its frame count runs out, and a leg's
      # markers are lines of that screen or of the device's own log.
      - name: Run ${{ matrix.app }} under MAME
        working-directory: reference/host/6502/${{ matrix.app }}
        env:
          RBCP_TARGET: ${{ matrix.target }}
          RBCP_FRAMES: ${{ matrix.frames }}
          RBCP_KEYS: ${{ matrix.keys }}
          RBCP_SEND: ${{ matrix.send }}
          MARKERS: ${{ matrix.markers }}
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/apple2-roms" 2>&1 | tee "$RUNNER_TEMP/run.log"
          printf '%s\n' "$MARKERS" > "$RUNNER_TEMP/markers"
          while IFS= read -r marker; do
              [ -n "$marker" ] || continue
              grep -qF -- "$marker" "$RUNNER_TEMP/run.log" \
                  || { echo "not in the log: $marker" >&2; exit 1; }
          done < "$RUNNER_TEMP/markers"

  build-romsel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Open Watcom is not packaged, and its installer needs a terminal.  The
      # snapshot tarball is the same tree it would lay down.
      - name: Install Open Watcom
        run: |
          curl -sSLO https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p "$HOME/watcom"
          tar xJf ow-snapshot.tar.xz -C "$HOME/watcom" --strip-components=1
          chmod -R +x "$HOME/watcom/binl64"
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "LIB=$HOME/watcom/lib286:$HOME/watcom/lib286/dos" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl64" >> "$GITHUB_PATH"

      - name: Build romsel
        working-directory: reference/host/x86/romsel
        run: wmake

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: romsel
          path: reference/host/x86/romsel/build/romsel.exe

  # The makefile's clean recipe is the one place the host shows through, and
  # only a DOS, Windows or OS/2 wmake takes that branch.  This job runs it.
  build-romsel-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Open Watcom
        shell: pwsh
        run: |
          curl.exe -sSLo ow-snapshot.tar.xz https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          New-Item -ItemType Directory -Force "$env:USERPROFILE\watcom" | Out-Null
          tar -xf ow-snapshot.tar.xz -C "$env:USERPROFILE\watcom" --strip-components=1
          Add-Content $env:GITHUB_ENV "WATCOM=$env:USERPROFILE\watcom"
          Add-Content $env:GITHUB_ENV "INCLUDE=$env:USERPROFILE\watcom\h"
          Add-Content $env:GITHUB_ENV "LIB=$env:USERPROFILE\watcom\lib286;$env:USERPROFILE\watcom\lib286\dos"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\watcom\binnt64"

      - name: Build romsel
        shell: pwsh
        working-directory: reference/host/x86/romsel
        run: wmake

      # Leaving nothing behind is part of what this job checks.
      - name: Clean romsel
        shell: pwsh
        working-directory: reference/host/x86/romsel
        run: |
          wmake clean
          if (Test-Path build) { throw "build/ survived wmake clean" }
