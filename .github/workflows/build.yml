name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'spec/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-c64-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get install -y cc65

      - name: Build c64-boot with pause before reset
        working-directory: reference/host/6502/c64-boot
        run: PAUSE_BEFORE_RESET=1 make

      - name: Build c64-boot
        working-directory: reference/host/6502/c64-boot
        run: make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: c64-boot
          path: reference/host/6502/c64-boot/build/c64_boot.bin

  build-vic20-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get install -y cc65

      - name: Build vic20-boot with pause before reset
        working-directory: reference/host/6502/vic20-boot
        run: PAUSE_BEFORE_RESET=1 make

      - name: Build vic20-boot
        working-directory: reference/host/6502/vic20-boot
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vic20-boot
          path: |
            reference/host/6502/vic20-boot/build/vic20_boot_pal.bin
            reference/host/6502/vic20-boot/build/vic20_boot_ntsc.bin

  build-apple2-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get install -y cc65

      - name: Build apple2-boot
        working-directory: reference/host/6502/apple2-boot
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple2-boot
          path: |
            reference/host/6502/apple2-boot/build/apple2_boot_f8.bin
            reference/host/6502/apple2-boot/build/apple2_boot_ef.bin

  build-c64-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65 and VICE
        run: sudo apt-get install -y cc65 vice

      # The default target builds the .prg and the .d64 that carries it, so
      # c1541 from VICE has to be here.
      #
      # Every demo board too, because each one assembles different code and
      # only a build catches a board whose tables no longer match the program.
      # Each demo board starts by clearing the build directory, so they go
      # first and the real build last.
      - name: Build c64-led-test
        working-directory: reference/host/6502/c64-led-test
        run: |
          for board in 0 1 2 3; do
            make clean
            make BOARD=$board build/rbcp_led_demo.prg
          done
          make clean
          make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c64-led-test
          path: |
            reference/host/6502/c64-led-test/build/rbcp_led_test.prg
            reference/host/6502/c64-led-test/build/rbcp-led-test.d64

  build-pipe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get install -y cc65

      # One program, three machines.  Every image has to be built, because the
      # shared code is assembled against a different screen, a different clock
      # and a different ROM address each time.
      - name: Build c64-pipe-test
        working-directory: reference/host/6502/c64-pipe-test
        run: make

      - name: Build vic20-pipe-test
        working-directory: reference/host/6502/vic20-pipe-test
        run: make

      - name: Build apple2-pipe-test
        working-directory: reference/host/6502/apple2-pipe-test
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipe-test
          path: |
            reference/host/6502/c64-pipe-test/build/c64_pipe_kernal.bin
            reference/host/6502/c64-pipe-test/build/c64_pipe_basic.bin
            reference/host/6502/c64-pipe-test/build/c64_pipe_combined.bin
            reference/host/6502/vic20-pipe-test/build/vic20_pipe_pal.bin
            reference/host/6502/vic20-pipe-test/build/vic20_pipe_ntsc.bin
            reference/host/6502/apple2-pipe-test/build/apple2_pipe_pal.bin
            reference/host/6502/apple2-pipe-test/build/apple2_pipe_ntsc.bin

  build-rbcp-meter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get install -y cc65

      # One program, three machines.  Each build has to be run, because the
      # shared code is assembled against a different screen and a different
      # ROM address every time.
      - name: Build c64-rbcp-stress
        working-directory: reference/host/6502/c64-rbcp-stress
        run: make

      - name: Build vic20-rbcp-stress
        working-directory: reference/host/6502/vic20-rbcp-stress
        run: make

      - name: Build apple2-rbcp-stress
        working-directory: reference/host/6502/apple2-rbcp-stress
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbcp-meter
          path: |
            reference/host/6502/c64-rbcp-stress/build/c64_meter_kernal.bin
            reference/host/6502/c64-rbcp-stress/build/c64_meter_basic.bin
            reference/host/6502/c64-rbcp-stress/build/c64_meter_combined.bin
            reference/host/6502/vic20-rbcp-stress/build/vic20_meter_pal.bin
            reference/host/6502/vic20-rbcp-stress/build/vic20_meter_ntsc.bin
            reference/host/6502/apple2-rbcp-stress/build/apple2_meter.bin

  build-rbcp-aux-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get install -y cc65

      # One program, three machines.  Each build has to be run, because the
      # shared code is assembled against a different screen and a different
      # ROM address every time.
      #
      # Every demo board too, because each one assembles different tables and
      # only a build catches a board whose tables no longer match the program.
      - name: Build c64-aux-io
        working-directory: reference/host/6502/c64-aux-io
        run: |
          make
          for board in 0 1 2; do
            make BOARD=$board demo
          done

      - name: Build vic20-aux-io
        working-directory: reference/host/6502/vic20-aux-io
        run: |
          make
          for board in 0 1 2; do
            make BOARD=$board demo
          done

      - name: Build apple2-aux-io
        working-directory: reference/host/6502/apple2-aux-io
        run: |
          make
          for board in 0 1 2; do
            make BOARD=$board demo
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbcp-aux-io
          path: |
            reference/host/6502/c64-aux-io/build/c64_auxio_kernal.bin
            reference/host/6502/c64-aux-io/build/c64_auxio_basic.bin
            reference/host/6502/c64-aux-io/build/c64_auxio_combined.bin
            reference/host/6502/vic20-aux-io/build/vic20_auxio_pal.bin
            reference/host/6502/vic20-aux-io/build/vic20_auxio_ntsc.bin
            reference/host/6502/apple2-aux-io/build/apple2_auxio.bin

  build-rbcp-term:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get install -y cc65

      # One program, three machines.  Each build has to be run, because the
      # shared code is assembled against a different screen and a different
      # ROM address every time.
      - name: Build c64-rbcp-term
        working-directory: reference/host/6502/c64-rbcp-term
        run: make && make selftest

      - name: Build vic20-rbcp-term
        working-directory: reference/host/6502/vic20-rbcp-term
        run: make && make selftest

      - name: Build apple2-rbcp-term
        working-directory: reference/host/6502/apple2-rbcp-term
        run: make && make selftest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbcp-term
          path: |
            reference/host/6502/c64-rbcp-term/build/c64_term_kernal.bin
            reference/host/6502/c64-rbcp-term/build/c64_term_basic.bin
            reference/host/6502/c64-rbcp-term/build/c64_term_combined.bin
            reference/host/6502/vic20-rbcp-term/build/vic20_term_pal.bin
            reference/host/6502/vic20-rbcp-term/build/vic20_term_ntsc.bin
            reference/host/6502/apple2-rbcp-term/build/apple2_term.bin

  build-amiga-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vasm is not packaged, and upstream ships a tarball rather than a repo.
      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Build amiga-boot
        working-directory: reference/host/68k/amiga-boot
        run: make images

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-boot
          path: |
            reference/host/68k/amiga-boot/build/amiga_boot_256k.bin
            reference/host/68k/amiga-boot/build/amiga_boot_512k.bin

  test-amiga-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Install MAME
        run: sudo apt-get install -y mame

      - name: Fetch the keyboard ROM
        run: |
          mkdir -p "$RUNNER_TEMP/amiga-roms"
          curl -sSLo "$RUNNER_TEMP/amiga-roms/6570-036" \
            https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Commodore/Amiga/6570-036.rom
          echo "83b21d0c8b93fc9b9b3b287fde4ec8f3badac5a2  $RUNNER_TEMP/amiga-roms/6570-036" \
            | sha1sum -c -

      - name: Build amiga-boot 256KB
        working-directory: reference/host/68k/amiga-boot
        run: make

      # MAME exits 0 whether the bootloader booted or stopped on its error
      # screen, so the log is the only thing that says which happened.  A pass
      # reaches the switch.
      #
      # Every Amiga harness fills chip RAM with junk before the application's
      # variables are set up, so a variable read before it is written reads
      # junk here as it does on the machine.  Each run is checked for the line
      # that says the fill happened, because a fill that stopped happening
      # would put every job back on the zeroed RAM MAME hands over.
      - name: Run amiga-boot 256KB under MAME
        working-directory: reference/host/68k/amiga-boot
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/run-256.log"
          grep -q "dirtied with" "$RUNNER_TEMP/run-256.log"
          grep -q SWITCH_AND_EXIT "$RUNNER_TEMP/run-256.log"

      # The 512KB build runs whether or not the 256KB one passed, so one
      # failing size never hides the other.
      - name: Build amiga-boot 512KB
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-boot
        run: make ROM_KB=512

      - name: Run amiga-boot 512KB under MAME
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-boot
        env:
          RBCP_TARGET: 512
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/run-512.log"
          grep -q "dirtied with" "$RUNNER_TEMP/run-512.log"
          grep -q SWITCH_AND_EXIT "$RUNNER_TEMP/run-512.log"

  build-amiga-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Build amiga-rbcp-stress
        working-directory: reference/host/68k/amiga-rbcp-stress
        run: make images

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-rbcp-stress
          path: |
            reference/host/68k/amiga-rbcp-stress/build/amiga_meter_256k.bin
            reference/host/68k/amiga-rbcp-stress/build/amiga_meter_512k.bin

  test-amiga-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Install MAME
        run: sudo apt-get install -y mame

      - name: Fetch the keyboard ROM
        run: |
          mkdir -p "$RUNNER_TEMP/amiga-roms"
          curl -sSLo "$RUNNER_TEMP/amiga-roms/6570-036" \
            https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Commodore/Amiga/6570-036.rom
          echo "83b21d0c8b93fc9b9b3b287fde4ec8f3badac5a2  $RUNNER_TEMP/amiga-roms/6570-036" \
            | sha1sum -c -

      - name: Build amiga-rbcp-stress 256KB
        working-directory: reference/host/68k/amiga-rbcp-stress
        run: make

      # A pass reaches a phase line, which takes 8192 commands.  The device is
      # told to get one command in a thousand wrong, so the ratio is measured
      # too.
      - name: Run amiga-rbcp-stress 256KB under MAME
        working-directory: reference/host/68k/amiga-rbcp-stress
        env:
          RBCP_FRAMES: 400
          RBCP_FAIL_EVERY: 1000
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/meter-256.log"
          grep -q "dirtied with" "$RUNNER_TEMP/meter-256.log"
          grep -q "PH 0000 DISPLAY ON" "$RUNNER_TEMP/meter-256.log"

      - name: Build amiga-rbcp-stress 512KB
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-rbcp-stress
        run: make ROM_KB=512

      - name: Run amiga-rbcp-stress 512KB under MAME
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-rbcp-stress
        env:
          RBCP_TARGET: 512
          RBCP_FRAMES: 400
          RBCP_FAIL_EVERY: 1000
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/meter-512.log"
          grep -q "dirtied with" "$RUNNER_TEMP/meter-512.log"
          grep -q "PH 0000 DISPLAY ON" "$RUNNER_TEMP/meter-512.log"

  build-amiga-pipe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Build amiga-pipe-test
        working-directory: reference/host/68k/amiga-pipe-test
        run: make images

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-pipe-test
          path: |
            reference/host/68k/amiga-pipe-test/build/amiga_pipe_256k.bin
            reference/host/68k/amiga-pipe-test/build/amiga_pipe_512k.bin

  test-amiga-pipe-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Install MAME
        run: sudo apt-get install -y mame

      - name: Fetch the keyboard ROM
        run: |
          mkdir -p "$RUNNER_TEMP/amiga-roms"
          curl -sSLo "$RUNNER_TEMP/amiga-roms/6570-036" \
            https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Commodore/Amiga/6570-036.rom
          echo "83b21d0c8b93fc9b9b3b287fde4ec8f3badac5a2  $RUNNER_TEMP/amiga-roms/6570-036" \
            | sha1sum -c -

      - name: Build amiga-pipe-test 256KB
        working-directory: reference/host/68k/amiga-pipe-test
        run: make

      # The device's tally reads all zeroes when nothing reached the pipe, so a
      # run is checked against the rate line and the fault line instead.
      - name: Run amiga-pipe-test 256KB under MAME
        working-directory: reference/host/68k/amiga-pipe-test
        env:
          RBCP_FRAMES: 400
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/pipe-256.log"
          grep -q "dirtied with" "$RUNNER_TEMP/pipe-256.log"
          grep -q "bits per second over" "$RUNNER_TEMP/pipe-256.log"
          grep -q "gaps 0 missing 0 repeats 0 stripe 0 malformed 0" "$RUNNER_TEMP/pipe-256.log"

      # A run starts and a rate comes out whether or not the path keys work,
      # so this presses 2 and requires the run the tester started to be the
      # one that key asks for.  Before the keyboard handled punctuation, a
      # shift flag left set in dirty chip RAM turned the digit into a character
      # the menu had nothing for.
      - name: Run amiga-pipe-test 256KB on the path key 2
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-pipe-test
        env:
          RBCP_FRAMES: 400
          RBCP_KEYS: 200:2;260:Enter
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/pipe-key.log"
          grep -q "dirtied with" "$RUNNER_TEMP/pipe-key.log"
          grep -q "paths LIB1" "$RUNNER_TEMP/pipe-key.log"

      - name: Build amiga-pipe-test 512KB
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-pipe-test
        run: make ROM_KB=512

      - name: Run amiga-pipe-test 512KB under MAME
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-pipe-test
        env:
          RBCP_TARGET: 512
          RBCP_FRAMES: 400
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/pipe-512.log"
          grep -q "dirtied with" "$RUNNER_TEMP/pipe-512.log"
          grep -q "bits per second over" "$RUNNER_TEMP/pipe-512.log"
          grep -q "gaps 0 missing 0 repeats 0 stripe 0 malformed 0" "$RUNNER_TEMP/pipe-512.log"

  build-amiga-term:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Build amiga-rbcp-term
        working-directory: reference/host/68k/amiga-rbcp-term
        run: make images

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-rbcp-term
          path: |
            reference/host/68k/amiga-rbcp-term/build/amiga_term_256k.bin
            reference/host/68k/amiga-rbcp-term/build/amiga_term_512k.bin

  test-amiga-term:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Install MAME
        run: sudo apt-get install -y mame

      - name: Fetch the keyboard ROM
        run: |
          mkdir -p "$RUNNER_TEMP/amiga-roms"
          curl -sSLo "$RUNNER_TEMP/amiga-roms/6570-036" \
            https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Commodore/Amiga/6570-036.rom
          echo "83b21d0c8b93fc9b9b3b287fde4ec8f3badac5a2  $RUNNER_TEMP/amiga-roms/6570-036" \
            | sha1sum -c -

      - name: Build amiga-rbcp-term 256KB
        working-directory: reference/host/68k/amiga-rbcp-term
        run: make

      # The run types a line and the far end sends it back with "you said" in
      # front.  The marker is that line on the screen, so it stands for the
      # keyboard, both pipes and the display together.
      - name: Run amiga-rbcp-term 256KB under MAME
        working-directory: reference/host/68k/amiga-rbcp-term
        env:
          RBCP_FRAMES: 500
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/term-256.log"
          grep -q "dirtied with" "$RUNNER_TEMP/term-256.log"
          grep -q "|<you said hello" "$RUNNER_TEMP/term-256.log"

      - name: Build amiga-rbcp-term 512KB
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-rbcp-term
        run: make ROM_KB=512

      - name: Run amiga-rbcp-term 512KB under MAME
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-rbcp-term
        env:
          RBCP_TARGET: 512
          RBCP_FRAMES: 500
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/term-512.log"
          grep -q "dirtied with" "$RUNNER_TEMP/term-512.log"
          grep -q "|<you said hello" "$RUNNER_TEMP/term-512.log"

  build-amiga-aux-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Build amiga-aux-io
        working-directory: reference/host/68k/amiga-aux-io
        run: make images

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-aux-io
          path: |
            reference/host/68k/amiga-aux-io/build/amiga_auxio_256k.bin
            reference/host/68k/amiga-aux-io/build/amiga_auxio_512k.bin

  test-amiga-aux-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Install MAME
        run: sudo apt-get install -y mame

      - name: Fetch the keyboard ROM
        run: |
          mkdir -p "$RUNNER_TEMP/amiga-roms"
          curl -sSLo "$RUNNER_TEMP/amiga-roms/6570-036" \
            https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Commodore/Amiga/6570-036.rom
          echo "83b21d0c8b93fc9b9b3b287fde4ec8f3badac5a2  $RUNNER_TEMP/amiga-roms/6570-036" \
            | sha1sum -c -

      - name: Build amiga-aux-io 256KB
        working-directory: reference/host/68k/amiga-aux-io
        run: make

      # The tester waits for keys, so the run presses H to drive GPIO 2 high.
      # A device that refuses the SET_AUX puts REFUSED where the marker is.
      - name: Run amiga-aux-io 256KB under MAME
        working-directory: reference/host/68k/amiga-aux-io
        env:
          RBCP_FRAMES: 300
          RBCP_KEYS: "200:H"
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/auxio-256.log"
          grep -q "dirtied with" "$RUNNER_TEMP/auxio-256.log"
          grep -q "SET 0/2 HIGH TAKEN" "$RUNNER_TEMP/auxio-256.log"

      - name: Build amiga-aux-io 512KB
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-aux-io
        run: make ROM_KB=512

      - name: Run amiga-aux-io 512KB under MAME
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-aux-io
        env:
          RBCP_TARGET: 512
          RBCP_FRAMES: 300
          RBCP_KEYS: "200:H"
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/auxio-512.log"
          grep -q "dirtied with" "$RUNNER_TEMP/auxio-512.log"
          grep -q "SET 0/2 HIGH TAKEN" "$RUNNER_TEMP/auxio-512.log"

  build-amiga-led-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Build amiga-led-test
        working-directory: reference/host/68k/amiga-led-test
        run: make images

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-led-test
          path: |
            reference/host/68k/amiga-led-test/build/amiga_led_test_256k.bin
            reference/host/68k/amiga-led-test/build/amiga_led_test_512k.bin

  test-amiga-led-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vasm
        run: |
          curl -sSLO http://sun.hasenbraten.de/vasm/release/vasm.tar.gz
          tar xzf vasm.tar.gz
          make -C vasm CPU=m68k SYNTAX=mot
          echo "$PWD/vasm" >> "$GITHUB_PATH"

      - name: Install MAME
        run: sudo apt-get install -y mame

      - name: Fetch the keyboard ROM
        run: |
          mkdir -p "$RUNNER_TEMP/amiga-roms"
          curl -sSLo "$RUNNER_TEMP/amiga-roms/6570-036" \
            https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Commodore/Amiga/6570-036.rom
          echo "83b21d0c8b93fc9b9b3b287fde4ec8f3badac5a2  $RUNNER_TEMP/amiga-roms/6570-036" \
            | sha1sum -c -

      - name: Build amiga-led-test 256KB
        working-directory: reference/host/68k/amiga-led-test
        run: make

      # The marker is the read back check on a brightness of 25.  B is the third
      # key the run presses.  A device reporting anything else prints DIFFERS in
      # place of AGREES.
      - name: Run amiga-led-test 256KB under MAME
        working-directory: reference/host/68k/amiga-led-test
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/led-256.log"
          grep -q "dirtied with" "$RUNNER_TEMP/led-256.log"
          grep -q "GOT 0 MODE 01 COL 56AC4D BRI 25 PER 0 AGREES" "$RUNNER_TEMP/led-256.log"

      - name: Build amiga-led-test 512KB
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-led-test
        run: make ROM_KB=512

      - name: Run amiga-led-test 512KB under MAME
        if: ${{ !cancelled() }}
        working-directory: reference/host/68k/amiga-led-test
        env:
          RBCP_TARGET: 512
        run: |
          set -o pipefail
          test/run.sh "$RUNNER_TEMP/amiga-roms" 2>&1 | tee "$RUNNER_TEMP/led-512.log"
          grep -q "dirtied with" "$RUNNER_TEMP/led-512.log"
          grep -q "GOT 0 MODE 01 COL 56AC4D BRI 25 PER 0 AGREES" "$RUNNER_TEMP/led-512.log"

  build-romsel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Open Watcom is not packaged, and its installer needs a terminal.  The
      # snapshot tarball is the same tree it would lay down.
      - name: Install Open Watcom
        run: |
          curl -sSLO https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          mkdir -p "$HOME/watcom"
          tar xJf ow-snapshot.tar.xz -C "$HOME/watcom" --strip-components=1
          chmod -R +x "$HOME/watcom/binl64"
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "LIB=$HOME/watcom/lib286:$HOME/watcom/lib286/dos" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl64" >> "$GITHUB_PATH"

      - name: Build romsel
        working-directory: reference/host/x86/romsel
        run: wmake

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: romsel
          path: reference/host/x86/romsel/build/romsel.exe

  # The makefile's clean recipe is the one place the host shows through, and
  # only a DOS, Windows or OS/2 wmake takes that branch.  This job runs it.
  build-romsel-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Open Watcom
        shell: pwsh
        run: |
          curl.exe -sSLo ow-snapshot.tar.xz https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          New-Item -ItemType Directory -Force "$env:USERPROFILE\watcom" | Out-Null
          tar -xf ow-snapshot.tar.xz -C "$env:USERPROFILE\watcom" --strip-components=1
          Add-Content $env:GITHUB_ENV "WATCOM=$env:USERPROFILE\watcom"
          Add-Content $env:GITHUB_ENV "INCLUDE=$env:USERPROFILE\watcom\h"
          Add-Content $env:GITHUB_ENV "LIB=$env:USERPROFILE\watcom\lib286;$env:USERPROFILE\watcom\lib286\dos"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\watcom\binnt64"

      - name: Build romsel
        shell: pwsh
        working-directory: reference/host/x86/romsel
        run: wmake

      # Leaving nothing behind is part of what this job checks.
      - name: Clean romsel
        shell: pwsh
        working-directory: reference/host/x86/romsel
        run: |
          wmake clean
          if (Test-Path build) { throw "build/ survived wmake clean" }
