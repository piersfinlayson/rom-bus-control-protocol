# apple2_boot_ef.cfg — ca65/ld65 linker configuration, Apple IIe
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# Zero-page layout:
#   $E8-$EE   zp_ptr_lo/hi, zp_tmp0-4  boot and screen scratch
#   $F0-$F6   rbcp_zp_0-6              RBCP library working registers
#   $F7-$FF   rbcp_arg0-8              RBCP command argument buffer
#
# ZP variables are fixed constants defined in the defs files; no ZEROPAGE
# segment is needed.  The linker does not manage ZP allocation.
#
# Memory:
#   RAM   $0800-$0FFF.  The first RAM bank, so the bootloader runs on a
#         machine with 4K fitted, and leaves text page 1 alone.
#   ROM   $E000-$FFFF.  The EF socket of a IIe, 8KB.  The image ends where the
#         2KB one does, so the back-channel region and the command page are at
#         the same addresses in both and the code is the same code.  The space
#         between the end of CODE and the back-channel is unused, and the
#         command page falls in it.
#
# Segment layout:
#   BOOT      Pre-relocation code: load=ROM, run=ROM.
#             Contains boot_entry, a2_hw_init, irq_nmi_stub.  These must run
#             from ROM because the CODE segment is not in RAM yet.  The RESET,
#             NMI and IRQ vectors point into this segment.
#
#   CODE      Post-relocation code and strings: load=ROM, run=RAM=$0800.
#             ld65 emits __CODE_LOAD__, __CODE_RUN__, __CODE_SIZE__.
#             boot_entry copies exactly these bytes to RAM and jumps there.
#             In the 2KB build it runs over the command page at $FE00, which
#             is allowed because every byte of it is read before the session
#             opens.  In this one the command page is past the end of it.
#
#   BCH       The back-channel region, 64 bytes at $FFB0.  It sits at the top
#             of the image, under the vectors, so that everything below it is
#             one unbroken run of code with no hole to work around.  It has to
#             be outside the command page, since the host reads it while the
#             session is open.
#
#   VECTORS   6-byte vector table at $FFFA-$FFFF, read at reset only.

MEMORY {
    RAM:   start = $0800, size = $0800, type = rw;
    ROM:   start = $E000, size = $2000, type = ro,
           fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    BCH:     load = ROM, type = ro,  start = $FFB0;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
