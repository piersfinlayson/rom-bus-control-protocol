# c64_boot_combined.cfg — ca65/ld65 linker configuration, 16KB combined image
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# A 16KB 23128 for a shortboard.  The output file is BASICROM then ROM, the
# order they are declared in.
#
# Memory:
#   RAM       $0800-$9FFF.  Variables, the command record and the code.
#   BASICROM  $A000-$BFFF.  The command page and the back channel, then zeros.
#   ROM       $E000-$FFFF.  The bootloader.
#
# Segments are as in c64_boot.cfg, except that FILL is in BASICROM.

MEMORY {
    RAM:      start = $0800, size = $9800, type = rw;
    BASICROM: start = $A000, size = $2000, type = ro,
              fill = yes, fillval = $00;
    ROM:      start = $E000, size = $2000, type = ro,
              fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM,      type = bss,  define = yes;
    FILL:    load = BASICROM, type = ro;
    BOOT:    load = ROM, run  = ROM,  type = ro;
    CODE:    load = ROM, run  = RAM,  type = ro,  define = yes;
    RODATA:  load = ROM, type = ro;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
