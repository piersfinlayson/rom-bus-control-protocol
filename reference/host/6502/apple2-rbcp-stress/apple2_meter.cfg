# apple2_meter.cfg — ca65/ld65 linker configuration, Apple IIe EF socket
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# Memory:
#   RAM   $0800-$7FFF.  Everything the meter runs and every byte it writes.
#         Text page 1 at $0400-$07FF is below it, and a IIe has 64K, so there
#         is no reason to be careful about the space above.
#   ROM   $E000-$FFFF.  The image the device serves.
#
# Segments:
#   BOOT      Reset entry and the copy into RAM: load=ROM, run=ROM.  It has to
#             run from ROM, there being nothing in RAM yet.  All three vectors
#             point into it.
#
#   CODE      Everything else, and RODATA behind it: load=ROM, run=RAM.  Both
#             are copied down before the first knock, because a host may not
#             read the image it is talking to, and fetching an instruction out
#             of it is reading it.  They are declared next to each other so
#             that one copy moves both.
#
#   BCH       The back-channel region, 64 bytes at $FFB0, under the vectors.
#             The command page at $FE00 falls in the gap between the end of
#             CODE and here.
#
#   VECTORS   6 bytes at $FFFA-$FFFF, read at reset and never again.

MEMORY {
    RAM:   start = $0800, size = $7800, type = rw;
    ROM:   start = $E000, size = $2000, type = ro,
           fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    RODATA:  load = ROM, run  = RAM, type = ro, define = yes;
    BCH:     load = ROM, type = ro,  start = $FFB0;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
