<title>One ROM logo editor</title>
<style>
  :root{--bg:#16181c;--panel:#1e2127;--line:#343a44;--ink:#e8e6e1;--dim:#9aa0ab;--gold:#FFBB00}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
       display:flex;flex-direction:column}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);
         padding:10px 14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .grp{display:flex;gap:6px;align-items:center}
  .grp>span.lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
  .pen{display:flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;
       background:#252932;border:2px solid transparent;border-radius:3px;
       color:var(--ink);font:inherit;cursor:pointer}
  .pen[aria-pressed="true"]{border-color:var(--gold);background:#2f343d}
  .sw{width:18px;height:18px;border:1px solid #666;flex:none}
  .sw.tr{background:repeating-conic-gradient(#888 0 25%,#444 0 50%) 0 0/8px 8px}
  button.b{padding:7px 12px;background:#252932;color:var(--ink);
           border:1px solid var(--line);border-radius:3px;font:inherit;cursor:pointer}
  button.b:hover{background:#2f343d}
  button.save{background:var(--gold);color:#16181c;border-color:var(--gold);font-weight:700}
  input[type=range]{width:110px;accent-color:var(--gold)}
  main{flex:1;overflow:auto;padding:14px;display:flex;align-items:flex-start;justify-content:center}
  canvas{image-rendering:pixelated;cursor:crosshair;flex:none;
         background:repeating-conic-gradient(#2a2d33 0 25%,#22252a 0 50%) 0 0/16px 16px}
  footer{flex:none;background:var(--panel);border-top:1px solid var(--line);
         padding:7px 14px;color:var(--dim);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  kbd{background:#2f343d;border:1px solid var(--line);border-radius:3px;padding:0 4px}
</style>
<header>
  <div class="grp" id="pens"></div>
  <div class="grp"><span class="lbl">Zoom</span>
    <input type="range" id="z" min="2" max="16" value="6"><span id="zl">6x</span></div>
  <div class="grp"><label><input type="checkbox" id="g" checked> grid</label></div>
  <div class="grp">
    <button class="b" id="undo">Undo</button>
    <button class="b" id="reset">Reset</button>
    <button class="b save" id="save">Save PNG</button>
  </div>
</header>
<main><canvas id="c"></canvas></main>
<footer>
  <span>Drag to paint. <kbd>Alt</kbd>-click picks a pen. <kbd>Cmd</kbd>/<kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes.</span>
  <span id="stat"></span>
</footer>
<script>

const W=112,H=92;
const PENS=[
 {n:0,name:"transparent",rgba:[0,0,0,0],  tr:true},
 {n:0,name:"black",      rgba:[0,0,0,255]},
 {n:3,name:"outline",    rgba:[17,17,17,255]},
 {n:4,name:"chip body",  rgba:[51,51,51,255]},
 {n:5,name:"pins",       rgba:[221,221,221,255]},
 {n:2,name:"One ROM gold",rgba:[255,187,0,255]},
];
let cur=PENS[3], zoom=6, grid=true, painting=false;
const c=document.getElementById('c'), ctx=c.getContext('2d');
const off=document.createElement('canvas'); off.width=W; off.height=H;
const octx=off.getContext('2d',{willReadFrequently:true});
let original=null, undoStack=[];

const img=new Image();
img.onload=()=>{octx.drawImage(img,0,0);original=octx.getImageData(0,0,W,H);draw();stat();};
img.src="data:image/png;base64,"+B64;

function draw(){
  c.width=W*zoom; c.height=H*zoom;
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,c.width,c.height);
  ctx.drawImage(off,0,0,c.width,c.height);
  if(grid&&zoom>=5){
    ctx.strokeStyle="rgba(255,255,255,.10)"; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<=W;x++){ctx.moveTo(x*zoom+.5,0);ctx.lineTo(x*zoom+.5,H*zoom);}
    for(let y=0;y<=H;y++){ctx.moveTo(0,y*zoom+.5);ctx.lineTo(W*zoom,y*zoom+.5);}
    ctx.stroke();
  }
}
function push(){ undoStack.push(octx.getImageData(0,0,W,H)); if(undoStack.length>60)undoStack.shift(); }
function at(e){
  const r=c.getBoundingClientRect();
  return [Math.floor((e.clientX-r.left)/zoom), Math.floor((e.clientY-r.top)/zoom)];
}
function put(x,y){
  if(x<0||y<0||x>=W||y>=H)return;
  const d=octx.createImageData(1,1);
  d.data.set(cur.rgba); octx.putImageData(d,x,y);
}
function pick(x,y){
  const p=octx.getImageData(x,y,1,1).data;
  const m=PENS.find(q=>q.rgba[3]===0?p[3]===0:(p[3]>0&&q.rgba[0]===p[0]&&q.rgba[1]===p[1]&&q.rgba[2]===p[2]));
  if(m){cur=m;paint();}
}
c.addEventListener('mousedown',e=>{
  const [x,y]=at(e);
  if(e.altKey){pick(x,y);return;}
  push(); painting=true; put(x,y); draw(); stat();
});
addEventListener('mousemove',e=>{ if(!painting)return; const[x,y]=at(e); put(x,y); draw(); });
addEventListener('mouseup',()=>{ if(painting){painting=false; stat();} });
c.addEventListener('contextmenu',e=>e.preventDefault());

function paint(){
  document.querySelectorAll('.pen').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.pen===cur.name));
}
const holder=document.getElementById('pens');
PENS.forEach(p=>{
  const b=document.createElement('button');
  b.className='pen'; b.dataset.pen=p.name;
  b.innerHTML=`<span class="sw ${p.tr?'tr':''}" ${p.tr?'':`style="background:rgb(${p.rgba.slice(0,3)})"`}></span>
               <span>${p.name}</span>`;
  b.onclick=()=>{cur=p;paint();};
  holder.appendChild(b);
});
paint();

document.getElementById('z').oninput=e=>{zoom=+e.target.value;document.getElementById('zl').textContent=zoom+'x';draw();};
document.getElementById('g').onchange=e=>{grid=e.target.checked;draw();};
document.getElementById('undo').onclick=()=>{const s=undoStack.pop(); if(s){octx.putImageData(s,0,0);draw();stat();}};
document.getElementById('reset').onclick=()=>{if(original){push();octx.putImageData(original,0,0);draw();stat();}};
document.getElementById('save').onclick=()=>{
  off.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='logo_112x92.png'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },'image/png');
};
function stat(){
  const d=octx.getImageData(0,0,W,H).data; const n={};
  for(let i=0;i<d.length;i+=4){
    const p=PENS.find(q=>q.rgba[3]===0?d[i+3]===0:(d[i+3]>0&&q.rgba[0]===d[i]&&q.rgba[1]===d[i+1]&&q.rgba[2]===d[i+2]));
    const k=p?p.name:'OFF PALETTE'; n[k]=(n[k]||0)+1;
  }
  document.getElementById('stat').textContent=
    Object.entries(n).map(([k,v])=>`${k} ${v}`).join('  ·  ');
}

addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){
    e.preventDefault(); document.getElementById('undo').click();
  }
});

</script>
