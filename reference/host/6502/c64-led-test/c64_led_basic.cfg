# c64_led_basic.cfg — ca65/ld65 linker configuration, 8KB BASIC image
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# An 8KB 2364 in the BASIC socket, with the machine's own kernal fitted.  The
# kernal enters it through the BASIC cold start vector at $A000.
#
# The same as the kernal build without the vectors, which aren't in this
# socket.

MEMORY {
    RAM:     start = $0800, size = $3000, type = rw;
    CHARSET: file = "", start = $3800, size = $0800, define = yes;
    ROM:     file = "%O", start = $A000, size = $2000, type = ro,
             fill = yes, fillval = $00;
    IMAGE:   file = "%O.payload", start = $0000, size = $8000, type = ro;
}

SEGMENTS {
    BSS:     load = RAM,   type = bss, define = yes;
    FILL:    load = ROM,   type = ro,  define = yes;
    BOOT:    load = ROM,   run  = ROM, type = ro, define = yes;
    CODE:    load = IMAGE, run  = RAM, type = ro, define = yes;
    RODATA:  load = IMAGE, run  = RAM, type = ro, define = yes;
    CHARS:   load = CHARSET, type = bss, define = yes;
}
