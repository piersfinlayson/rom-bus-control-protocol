# c64_pipe_combined.cfg — ca65/ld65 linker configuration, 16KB combined image
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# A 16KB 23128 spanning both ROM sockets.  The first half is what the machine
# sees at $A000-$BFFF, where BASIC would be, and the second is $E000-$FFFF,
# where the kernal would be.  The output file is the two halves in that order,
# which is the order the parts are declared below.
#
# The BASIC half is blank but for the command page and the back channel, and
# the tester has no use for BASIC.  Putting the device's replies there means the
# half the machine boots out of is never written to at all.
#
# Memory:
#   RAM       $0800-$CFFF, as in the kernal build.
#   BASICROM  $A000-$BFFF.  768 bytes of it are used and the rest is zero.
#   ROM       $E000-$FFFF.  The tester.
#
# Segments are as the kernal build's, but for FILL landing in the other half.

MEMORY {
    RAM:      start = $0800, size = $C800, type = rw;
    BASICROM: start = $A000, size = $2000, type = ro,
              fill = yes, fillval = $00;
    ROM:      start = $E000, size = $2000, type = ro,
              fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM,      type = bss, define = yes;
    FILL:    load = BASICROM, type = ro;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    RODATA:  load = ROM, run  = RAM, type = ro, define = yes;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
