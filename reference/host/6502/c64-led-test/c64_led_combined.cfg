# c64_led_combined.cfg — ca65/ld65 linker configuration, 16KB combined image
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# A 16KB 23128 spanning both ROM sockets, BASIC half first.  The output file
# contains the halves in the order their memory areas are declared.
#
# The tester fits in neither half, so it is split across them.
#
# Memory:
#   BASICROM  The command page, the back channel and RODATA.
#   ROM       The reset entry, CODE and the vectors.

MEMORY {
    RAM:      start = $0800, size = $3000, type = rw;
    CHARSET:  file = "", start = $3800, size = $0800, define = yes;
    BASICROM: start = $A000, size = $2000, type = ro,
              fill = yes, fillval = $00;
    ROM:      start = $E000, size = $2000, type = ro,
              fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    FILL:    load = BASICROM, type = ro;
    RODATA:  load = BASICROM, run = RAM, type = ro, define = yes;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    CHARS:   load = CHARSET, type = bss, define = yes;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
