# vic20_meter.cfg — ca65/ld65 linker configuration, VIC-20 kernal socket
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# Memory:
#   RAM   $0400-$1DFF.  The screen sits above it at $1E00.  An unexpanded
#         VIC-20 has only $1000-$1DFF, so this build needs the 3K block at
#         $0400-$0FFF fitted.  ld65 refuses to link if the meter outgrows it,
#         so a build that comes out is a build that fits.
#   ROM   $E000-$FFFF.  The image the device serves.
#
# Segments:
#   FILL      768 zero bytes at $E000 — the command page, then the
#             back-channel region at $E100.  The device writes here.
#
#   BOOT      Reset entry, VIC and VIA setup, and the copy into RAM:
#             load=ROM, run=ROM.  It has to run from ROM, there being nothing
#             in RAM yet.  All three vectors point into it.
#
#   CODE      Everything else, and RODATA behind it: load=ROM, run=RAM.  Both
#             are copied down before the first knock, because a host may not
#             read the image it is talking to, and fetching an instruction out
#             of it is reading it.
#
#   VECTORS   6 bytes at $FFFA-$FFFF, read at reset and never again.

MEMORY {
    RAM:   start = $0400, size = $1A00, type = rw;
    ROM:   start = $E000, size = $2000, type = ro,
           fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    FILL:    load = ROM, type = ro;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    RODATA:  load = ROM, run  = RAM, type = ro, define = yes;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
