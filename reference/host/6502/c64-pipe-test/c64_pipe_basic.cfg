# c64_pipe_basic.cfg — ca65/ld65 linker configuration, 8KB BASIC image
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# An 8KB 2364 at $A000-$BFFF, in the BASIC socket, with the machine's own
# kernal still fitted.  The kernal runs at reset and enters BASIC through the
# word at $A000, which is where this image is entered.
#
# Memory:
#   RAM   $0800-$CFFF, as in the kernal build.
#   ROM   $A000-$BFFF.  The image the device serves.
#
# Segments are the kernal build's without the vector table, there being no
# $FFFA in this half of the address space.  FILL still comes first, so the
# command page is the first page of the image and the back channel the two
# after it, at $A100-$A2FF.

MEMORY {
    RAM:   start = $0800, size = $C800, type = rw;
    ROM:   start = $A000, size = $2000, type = ro,
           fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    FILL:    load = ROM, type = ro;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    RODATA:  load = ROM, run  = RAM, type = ro, define = yes;
}
