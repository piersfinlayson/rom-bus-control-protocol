# vic20_auxio.cfg — ca65/ld65 linker configuration, VIC-20 kernal socket
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# Memory:
#   RAM   $0400-$1DFF.  The 3K expansion fills $0400-$0FFF and the machine's
#         own RAM runs on to $1DFF, so the two are one 6656 byte run with the
#         screen above it at $1E00, where an unexpanded machine puts it.  The
#         tester does not fit in the 3.5K an unexpanded machine has.  ld65
#         refuses to link if it outgrows what is here, so a build that comes
#         out is a build that fits.
#   ROM   $E000-$FFFF.  The image the device serves.
#
# Segments:
#   FILL      768 bytes at $E000.  The command page, then the 512 byte
#             back-channel region at $E100.  The device writes into both.  The
#             reset screen reads the flash slot list, whose records are 32
#             bytes each, so the 64 bytes the terminal manages with are not
#             enough here.
#
#   BOOT      Entry, VIC and VIA setup, and the copy into RAM: load=ROM,
#             run=ROM.  It has to run from ROM, there being nothing in RAM yet.
#
#   CODE      Everything else, and RODATA behind it: load=ROM, run=RAM.  Both
#             are copied down before the first knock, because the command page
#             is a page of this image, and a host fetching instructions out of
#             it would be sending command bytes.  They are declared next to
#             each other so that one copy moves both.
#
#   VECTORS   $FFFA-$FFFF.  This image is the kernal, so it holds them.

MEMORY {
    RAM:   start = $0400, size = $1A00, type = rw;
    ROM:   start = $E000, size = $2000, type = ro,
           fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    FILL:    load = ROM, type = ro;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    RODATA:  load = ROM, run  = RAM, type = ro, define = yes;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
