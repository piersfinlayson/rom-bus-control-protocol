# c64_term_kernal.cfg — ca65/ld65 linker configuration, 8KB kernal image
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# An 8KB 2364 at $E000-$FFFF, in the kernal socket.  The machine boots into it.
#
# Memory:
#   RAM   $0800-$CFFF.  Everything the terminal runs and every byte it writes.
#         The screen at $0400-$07E7 is below it and the I/O page above.
#   ROM   $E000-$FFFF.  The image the device serves.
#
# Segments:
#   FILL      768 zero bytes at $E000 — the command page, then the 512 byte
#             back-channel region at $E100-$E2FF.  The device writes here.
#
#   BOOT      Reset entry, the copy into RAM, and the two interrupt stubs:
#             load=ROM, run=ROM.  They have to run from ROM, there being
#             nothing in RAM at reset and nothing to say when an NMI arrives.
#             All three vectors point into it.
#
#   CODE      Everything else, and RODATA behind it: load=ROM, run=RAM.  Both
#             are copied down before the first knock, because the command page
#             is a page of this image, and a host fetching instructions out of
#             it would be sending command bytes.  They are declared next to
#             each other so that one copy moves both.
#
#   VECTORS   6 bytes at $FFFA-$FFFF, read at reset and on RESTORE.

MEMORY {
    RAM:   start = $0800, size = $C800, type = rw;
    ROM:   start = $E000, size = $2000, type = ro,
           fill = yes, fillval = $00;
}

SEGMENTS {
    BSS:     load = RAM, type = bss, define = yes;
    FILL:    load = ROM, type = ro;
    BOOT:    load = ROM, run  = ROM, type = ro;
    CODE:    load = ROM, run  = RAM, type = ro, define = yes;
    RODATA:  load = ROM, run  = RAM, type = ro, define = yes;
    VECTORS: load = ROM, type = ro,  start = $FFFA;
}
