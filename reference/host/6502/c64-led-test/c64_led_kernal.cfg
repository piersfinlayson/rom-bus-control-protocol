# c64_led_kernal.cfg — ca65/ld65 linker configuration, 8KB kernal image
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# An 8KB 2364 in the kernal socket.  The machine boots into it.
#
# CODE and RODATA don't fit the socket unpacked.  ld65 can't pack, so it writes
# ROM and IMAGE as two files and tools/pack_rom.py packs IMAGE into ROM after
# BOOT.  pack_rom.py also fails an image too big for the socket.
#
# Memory:
#   CHARSET  The character set charset.s builds.  A program that grew into it
#            fails to link here rather than on screen.
#   ROM      The command page, the boot block and the vectors, with the packed
#            stream between the last two.
#   IMAGE    CODE and RODATA as unpacked.  Its addresses are never used.
#
# Segments:
#   FILL      The command page, then the back-channel region.  The device
#             writes here.
#
#   BOOT      Reset entry, the unpacker and the interrupt stub.  They run from
#             ROM because RAM is empty at reset.
#
#   CODE      Everything else, with RODATA behind it.  Both run from RAM
#             because the command page is a page of this image, and fetching
#             instructions from it would send command bytes.

MEMORY {
    RAM:     start = $0800, size = $3000, type = rw;
    CHARSET: file = "", start = $3800, size = $0800, define = yes;
    ROM:     file = "%O", start = $E000, size = $2000, type = ro,
             fill = yes, fillval = $00;
    IMAGE:   file = "%O.payload", start = $0000, size = $8000, type = ro;
}

SEGMENTS {
    BSS:     load = RAM,   type = bss, define = yes;
    FILL:    load = ROM,   type = ro,  define = yes;
    BOOT:    load = ROM,   run  = ROM, type = ro, define = yes;
    CODE:    load = IMAGE, run  = RAM, type = ro, define = yes;
    RODATA:  load = IMAGE, run  = RAM, type = ro, define = yes;
    CHARS:   load = CHARSET, type = bss, define = yes;
    VECTORS: load = ROM,   type = ro,  start = $FFFA, define = yes;
}
