# pipe_test.cfg — ca65/ld65 linker configuration
# Copyright (C) 2026 Piers Finlayson <piers@piers.rocks>
#
# Builds a C64 PRG loading at $0801.  LOADADDR holds the two byte load address
# that makes it a PRG, BASICSTUB the "10 SYS 2061" line that RUN executes.
#
# BOOT exists because c64_hw.s puts c64_hw_init there.  That routine blanks the
# screen, rewrites the CPU port and reprograms CIA2 port A, and must never be
# called from this program — it is here only so its segment has somewhere to
# land.  Nothing references it.
#
# Zero page is not managed by the linker.  Every zero page address in this
# program is a constant in pipe_defs.s or rbcp_defs.s, and the whole of
# $D0-$FF is saved on entry and restored on exit.

MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $97FF, define = yes;
}

SEGMENTS {
    LOADADDR:  load = LOADADDR, type = ro;
    BASICSTUB: load = MAIN,     type = ro;
    ENTRY:     load = MAIN,     type = ro;
    CODE:      load = MAIN,     type = ro;
    BOOT:      load = MAIN,     type = ro;
    RODATA:    load = MAIN,     type = ro;
    BSS:       load = MAIN,     type = bss, define = yes;
}
